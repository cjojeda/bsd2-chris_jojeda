name: Sou Linda System · Web local

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'public/**', 'server/**', 'tests-web/**', 'scripts/**', '*.cmd', '*.json', 'vite.config.ts', '.github/workflows/web-local.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'server/**', 'tests-web/**', 'scripts/**', '*.cmd', '*.json', 'vite.config.ts', '.github/workflows/web-local.yml']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m pytest -c server/pyproject.toml server/tests -q
      - run: python server/run.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Sou-Linda-System-Web-${{ matrix.os }}
          path: |
            dist/
            server/src/
            server/run.py
            server/requirements.txt
            server/pyproject.toml
            server/docs/
            src/
            public/
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            index.html
            scripts/
            *.cmd
            docs/web-local.md
            docs/architecture-web.md
            docs/alternativa-agil.md
            docs/referencias-treinta.md
            docs/validacion.md
            README.md
            !**/__pycache__/**
          if-no-files-found: error
