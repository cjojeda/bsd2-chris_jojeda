[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sadi-local-web"
version = "0.5.0"
description = "Sou Linda System: aplicación web con datos SQLite en la notebook y reportes móviles locales"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "openpyxl==3.1.5", "qrcode==8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sadi_local = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
